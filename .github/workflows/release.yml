name: 发布插件

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装打包依赖
        run: npm install --no-save jszip@3

      # 打包全部插件并生成 index.json。
      # 脚本固定了 zip 条目时间戳，因此同一份源码每次生成的 SHA-256 完全一致，
      # Release 资产与索引里的校验值不会对不上。
      - name: 打包并生成索引
        run: node scripts/build-index.mjs

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-plugins/*.moext
          generate_release_notes: true

      # 索引必须提交回默认分支，客户端才会看到新版本。
      - name: 提交 index.json
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp index.json "$RUNNER_TEMP/index.json"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/index.json" index.json
          git add index.json
          if git diff --staged --quiet; then
            echo "索引无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新插件索引（${{ github.ref_name }}）"
          git push origin main
